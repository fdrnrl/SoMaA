# Сервисы СМА (раздел 15.1).
#   make up   — db, migrate, loader
#   make dev  — то же плюс mock-api; загрузчик берет данные из mock-api
#   make backup-service — копии базы каждые 30 минут (профиль exam)

services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sma}
      POSTGRES_USER: ${POSTGRES_USER:-sma_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?заполните POSTGRES_PASSWORD в .env}
    ports:
      # Только для этого компьютера: DBeaver и тесты подключаются к localhost:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Применяет миграции и завершается.
  migrate:
    build: .
    image: sma-pipeline
    command: python db/migrate.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # Загрузчик по расписанию. Конфиг платформ — SMA_LOADER_CONFIG (make dev ставит mock).
  loader:
    build: .
    image: sma-pipeline
    command: python -m sma.loader.run
    env_file: .env
    environment:
      SMA_PLATFORMS_CONFIG: ${SMA_LOADER_CONFIG:-config/platforms.yaml}
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports        # отчеты о качестве (раз в 10 минут)
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 40s       # дождаться конца текущей страницы (таймаут запроса — 30 с)

  # Тестовый API платформ по набору генератора (сначала make gen-medium).
  mock-api:
    build: .
    image: sma-pipeline
    profiles: [dev]
    command: >
      python -m sma.mockapi.server --host 0.0.0.0 --port 8000
      --data data/generated/${MOCK_DATA:-medium}
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  # Резервные копии каждые 30 минут (раздел 14). pg_dump 16 — в образе.
  backup:
    build: .
    image: sma-pipeline
    profiles: [exam]
    command: python -m sma.backup.run --every 30
    env_file: .env
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
